[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "czce-radar"
version = "0.1.0"
description = "郑商所品种预测研判系统"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "arq>=0.26",
  "redis>=5.2",
  "httpx>=0.27",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "pgserver>=0.1.4",
  "types-PyYAML>=6.0",
  "types-openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "jobs", "packages/schema/czce_schema"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "jobs", "packages/schema", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "jobs", "czce_schema"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["apps/api/app", "jobs", "packages/schema/czce_schema"]
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["arq.*", "lightgbm.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
